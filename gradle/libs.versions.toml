[versions]
agp = "9.5.0"
annotation = "1.0.0"
autofill = "1.1.0"
dexmaker = "1.2"
jsr305 = "3.0.2"
junit = "4.12"
material = "1.14.0-alpha09"
mockito = "1.9.5"
preference = "1.2.1"
testExtJunit = "1.1.1"
testRules = "1.1.1"
uiautomator = "2.2.0"
viewpager2 = "1.0.0"

[libraries]
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
androidx-autofill = { module = "androidx.autofill:autofill", version.ref = "autofill" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "preference" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "testExtJunit" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "testRules" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
dexmaker = { module = "com.google.dexmaker:dexmaker", version.ref = "dexmaker" }
dexmaker-mockito = { module = "com.google.dexmaker:dexmaker-mockito", version.ref = "dexmaker" }
jsr305 = { module = "com.google.code.findbugs:jsr305", version.ref = "jsr305" }
junit = { module = "junit:junit", version.ref = "junit" }
material = { module = "com.google.android.material:material", version.ref = "material" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
pvot-design-system-views = { module = "com.prauga.pvot:design-system-views" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
