plugins {
    id 'com.android.application'
}

android {
    namespace 'org.prauga.keyboard'
    compileSdk 35
    ndkVersion '25.1.8937393'

    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'

    defaultConfig {
        applicationId 'org.prauga.keyboard'
        minSdk 30
        targetSdk 34
        versionCode 30
        versionName "1.0"

        testApplicationId 'org.prauga.keyboard.tests'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = false

        signingConfig signingConfigs.debug
    }

    signingConfigs {
        debug {
            storeFile file("shared.keystore")
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".dev"
            minifyEnabled false
            resValue 'string', 'authority', 'org.prauga.keyboard.dev.dictionarypack'
        }
        release {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            resValue 'string', 'authority', 'org.prauga.keyboard.dictionarypack'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/AndroidNdk.mk'
        }
    }

    androidResources {
        noCompress 'dict'
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'com.google.android.material:material:1.14.0-alpha09'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.autofill:autofill:1.1.0'

    testImplementation 'junit:junit:4.12'
    androidTestImplementation "org.mockito:mockito-core:1.9.5"
    androidTestImplementation 'com.google.dexmaker:dexmaker:1.2'
    androidTestImplementation 'com.google.dexmaker:dexmaker-mockito:1.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test:rules:1.1.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.2.0'
    androidTestImplementation 'androidx.annotation:annotation:1.0.0'
}
